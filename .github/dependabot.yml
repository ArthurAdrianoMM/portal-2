# One grouped pull request per ecosystem a month, so updates stay reviewable.
# CI runs on each one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Wait a week before proposing a new release, so a compromised one is usually caught first.
    cooldown:
      default-days: 7
    ignore:
      # The Node types follow the oldest supported Node (engines in package.json), not the
      # newest, so code can't use an API that Node 22 users don't have. Bump this major by
      # hand together with engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
