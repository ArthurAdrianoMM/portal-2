# The hosted portal-2: the server, reachable only through a Cloudflare Tunnel.
# No port is published; cloudflared reaches the app on the compose network.
# Setup: docs/HOSTING.md ("Running it"). Values come from .env (see .env.example).

services:
  app:
    # Built and pushed by each release (.github/workflows/release.yml). PORTAL2_TAG in .env
    # pins a version, as 0.2.0; `docker compose up -d --build` builds this checkout instead.
    image: ghcr.io/arthuradrianomm/portal-2:${PORTAL2_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Defina PUBLIC_URL no .env, como https://portal.example.com}
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Defina TUNNEL_TOKEN no .env, com o token do túnel da Cloudflare}
      # Where the tunnel sends everything. A tunnel configured in the dashboard uses its own
      # public hostnames instead; one created with the CLI has only this.
      TUNNEL_URL: http://app:4321
    depends_on:
      app:
        condition: service_healthy

volumes:
  # sessions.json: remembered sessions, passwords encrypted by each session's token.
  data:
